name: Backend CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-ci:
    name: Backend Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      
      - name: Checkout repository
        uses: actions/checkout@v4

      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: |
          find . -path ./node_modules -prune -o -type f -name '*.js' -print0 | xargs -0 -r -n 1 node --check
