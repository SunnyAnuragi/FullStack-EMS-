name: Frontend CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:  

permissions:
  contents: read

jobs:
  frontend-ci:
    name: Frontend Build and Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
     
      - name: Checkout repository
        uses: actions/checkout@v4

      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      
      - name: Install dependencies
        run: npm ci

      # Step 4: Run ESLint
      - name: Run ESLint
        run: npm run lint

      # Step 5: Build frontend
      - name: Build frontend
        run: npm run build
